<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отписка от рассылки — Helpsy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; display: flex; align-items: center; min-height: 100vh; }
        .card { max-width: 450px; margin: auto; border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="card p-4 text-center">
        <h4 class="fw-bold mb-3">Управление подпиской</h4>
        <p class="text-muted small" id="statusText">Пожалуйста, подтвердите отписку от email-рассылок сервиса Helpsy.</p>
        <button id="unsubBtn" class="btn btn-outline-danger w-100 py-2 fw-semibold" onclick="processUnsubscribe()">
            Отписаться от рассылки
        </button>
    </div>

    <script>
        // Замените на URL вашего развернутого сервиса в Cloud Run
        const CRM_API_URL = "";

        function getToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get("token");
        }

        async function processUnsubscribe() {
            const token = getToken();
            const btn = document.getElementById("unsubBtn");
            const status = document.getElementById("statusText");

            if (!token) {
                status.innerText = "Ошибка: недействительный токен или ссылка повреждена.";
                status.className = "text-danger small";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Обработка...";

            try {
                const response = await fetch(CRM_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token })
                });
                const res = await response.json();

                if (response.ok) {
                    btn.style.display = "none";
                    status.innerText = "Вы успешно отписались от нашей информационной рассылки.";
                    status.className = "text-success fw-bold";
                } else {
                    btn.disabled = false;
                    btn.innerText = "Попробовать снова";
                    status.innerText = res.error || "Произошла ошибка при отписке.";
                    status.className = "text-danger small";
                }
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "Попробовать снова";
                status.innerText = "Сервер недоступен. Попробуйте позже.";
                status.className = "text-danger small";
            }
        }
    </script>
</body>
</html>
