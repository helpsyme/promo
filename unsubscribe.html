<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управління підпискою — Helpsy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card { 
            width: 100%;
            max-width: 440px; 
            border: 1px solid #1e293b; 
            border-radius: 16px; 
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
        }
        .btn-unsub {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }
        .btn-unsub:hover:not(:disabled) {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
            color: #ffffff;
        }
        .btn-unsub:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .text-muted-custom {
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card p-4 p-sm-5 text-center">
        <h4 class="fw-bold mb-3 text-white text-center">Управління підпискою</h4>
        <p class="text-muted-custom small mb-4 text-center" id="statusText">Будь ласка, підтвердіть відписку від email-розсилок сервісу Helpsy.</p>
        <div class="d-flex justify-content-center">
            <button id="unsubBtn" class="btn btn-unsub w-100 py-2.5 fw-semibold" onclick="processUnsubscribe()">
                Відписатися від розсилки
            </button>
        </div>
    </div>

    <script>
        // Замініть на URL вашого розгорнутого сервісу в Cloud Run
        const CRM_API_URL = "https://crm-cloud-run-url.a.run.app/api/unsubscribe";

        function getToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get("token");
        }

        async function processUnsubscribe() {
            const token = getToken();
            const btn = document.getElementById("unsubBtn");
            const status = document.getElementById("statusText");

            if (!token) {
                status.innerText = "Помилка: недійсний токен або посилання пошкоджено.";
                status.className = "text-danger small mb-4 text-center";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Обробка...";

            try {
                const response = await fetch(CRM_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token })
                });
                const res = await response.json();

                if (response.ok) {
                    btn.style.display = "none";
                    status.innerText = "Ви успішно відписалися від нашої інформаційної розсилки.";
                    status.className = "text-success fw-bold mb-0 text-center";
                } else {
                    btn.disabled = false;
                    btn.innerText = "Спробувати знову";
                    status.innerText = res.error || "Сталася помилка під час відписки.";
                    status.className = "text-danger small mb-4 text-center";
                }
            } catch (e) {
                btn.disabled = false;
                btn.innerText = "Спробувати знову";
                status.innerText = "Сервер недоступний. Спробуйте пізніше.";
                status.className = "text-danger small mb-4 text-center";
            }
        }
    </script>
</body>
</html>
